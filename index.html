<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#17121f; --surface:#221a2d; --surface2:#2c2239; --line:#3d3150;
  --fg:#f4ede2; --muted:#ab9fb8; --amber:#f2a93b; --amber-ink:#2a1a05;
  --red:#ff6b5e; --green:#6fd39b; --blue:#8cb8ff;
  --display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.55;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;padding:20px 0 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:28px;margin:0}
h1 span{color:var(--amber)}
h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0}
h3{font-family:var(--display);font-weight:500;font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .center{text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-size:14px;color:var(--muted)}
input[type=text],select{font:500 16px var(--body);color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.code-in{font:600 26px var(--display)!important;letter-spacing:6px;text-align:center;text-transform:uppercase}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn{font:500 16px var(--display);border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.danger{background:var(--red);color:#2b0805;border-color:var(--red)}
.btn.sm{font-size:13px;padding:5px 10px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:42px;height:42px;border-radius:12px;font:600 20px var(--display);background:var(--surface2);color:var(--fg);border:1px solid var(--line);cursor:pointer}
.stepper button:disabled{opacity:.4}
.stepper output{font:600 22px var(--display);min-width:2ch;text-align:center}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;font:500 14px var(--body);background:none;border:0;color:var(--muted);padding:8px 4px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--fg)}
.seg button:disabled{opacity:.4}
.check{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--fg)}
.check input{width:20px;height:20px;accent-color:var(--amber)}
.roomcode{font:600 40px var(--display);letter-spacing:8px;color:var(--amber);text-align:center;line-height:1.1}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.plist .seatno{font:600 15px var(--display);width:28px;height:28px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.plist .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.plist .nm b{font-weight:600;overflow-wrap:anywhere}
.plist .nm span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.plist li.out{opacity:.55}
.plist li.out b{text-decoration:line-through}
.plist li.start{border-color:var(--green)}
.plist li.mine{border-color:var(--amber)}
.tagr{font:500 12px var(--body);padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);flex:none;white-space:nowrap}
.tagr.spy{border-color:var(--red);color:var(--red)} .tagr.white{border-color:var(--blue);color:var(--blue)} .tagr.civ{border-color:var(--green);color:var(--green)}
.tagr.ok{border-color:var(--amber);color:var(--amber)}
.votes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.vbtn{font:500 15px var(--body);background:var(--surface2);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.vbtn.skip{border-style:dashed;color:var(--muted)}
.vbtn small{display:block;color:var(--muted);font-size:12px}
.vbtn[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.vbtn[aria-pressed="true"] small{color:var(--amber-ink)}
.coaster{width:min(280px,80vw);aspect-ratio:1;margin:4px auto;border-radius:50%;background:radial-gradient(circle at 50% 45%,#3a2a19 0%,#2a1d12 70%);border:3px solid var(--amber);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;cursor:pointer;user-select:none;color:var(--fg);font:inherit;padding:24px}
.coaster::before{content:"";position:absolute;inset:12px;border-radius:50%;border:2px dashed rgba(242,169,59,.45);pointer-events:none}
.coaster .word{font:600 clamp(26px,8.5vw,38px) var(--display);color:var(--amber);line-height:1.15;overflow-wrap:anywhere}
.coaster .hint{font-size:14px;color:var(--muted)}
.coaster .role{font:500 16px var(--body);color:var(--fg);background:rgba(0,0,0,.25);border-radius:999px;padding:3px 12px}
.coaster .sn{font:500 13px var(--display);letter-spacing:1.5px;color:var(--muted)}
.result{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface2)}
.result.spy{border-color:var(--red)} .result.civ{border-color:var(--green)} .result.white{border-color:var(--blue)}
.result.win{border-color:var(--amber);background:#33240f}
.result .t{font:600 18px var(--display)}
.drink{color:var(--amber);font-weight:600}
.err{color:var(--red);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(10,6,16,.72);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal .box{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:24px 20px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .box.good{border-color:var(--green)} .modal .box.bad{border-color:var(--red)} .modal .box.white{border-color:var(--blue)} .modal .box.win{border-color:var(--amber)}
.modal .big{font:600 26px var(--display);line-height:1.25}
.modal .good .big{color:var(--green)} .modal .bad .big{color:var(--red)} .modal .white .big{color:var(--blue)} .modal .win .big{color:var(--amber)}
.modal .me{font:600 17px var(--display);padding:6px 12px;border-radius:999px;background:var(--surface2);align-self:center}
@media (prefers-reduced-motion:no-preference){.modal .box{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}}
.timer{display:flex;align-items:center;gap:14px;background:var(--surface2);border:1px solid var(--amber);border-radius:14px;padding:12px 14px}
.timer .sec{font:600 38px var(--display);color:var(--amber);min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.timer.low .sec{color:var(--red)}
.hist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.hist .rd{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.hist .rd ul{padding-left:18px;gap:2px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;z-index:20;max-width:90vw}
.toast.bad{border-color:var(--red);color:var(--red)}
ol,ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
details summary{cursor:pointer;font:500 16px var(--display)}
.foot{font-size:13px;color:var(--muted);text-align:center}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}
.live.off{background:var(--red)}
.linkbox{font-size:13px;word-break:break-all;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;user-select:all}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const LS={
  get(k,d){try{const v=localStorage.getItem("spyon:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{v==null?localStorage.removeItem("spyon:"+k):localStorage.setItem("spyon:"+k,JSON.stringify(v))}catch(e){}}
};
/* ===== ตั้งค่าตอนฝากเว็บบน GitHub Pages =====
   วางลิงก์เว็บแอป Apps Script ที่ลงท้ายด้วย /exec ไว้ในเครื่องหมายคำพูดด้านล่าง
   (ถ้าเปิดผ่านลิงก์ Apps Script โดยตรง ไม่ต้องแก้อะไร) */
const API_URL = "https://script.google.com/macros/s/AKfycbyrJ8eRTPrS35AMIbQvtMnIst4SYjXCgkDFCAsehLLDanb9PB9OTyRruxJATOFI3N8R/exec";
const IN_GAS = !!(window.google&&google.script&&google.script.run);
function apiUrl(){return API_URL||LS.get("api","")}
if(!IN_GAS){
  document.title="ใครคือสายลับ";
  if(!document.querySelector('meta[name=viewport]')){const m=document.createElement("meta");m.name="viewport";m.content="width=device-width, initial-scale=1, viewport-fit=cover";document.head.append(m)}
}
function call(action,p){
  if(!IN_GAS){
    const u=apiUrl();
    if(!u) return Promise.reject(new Error("ยังไม่ได้ตั้งลิงก์ Apps Script"));
    // ส่งเป็น text/plain เพื่อไม่ให้เบราว์เซอร์ติด CORS preflight
    return fetch(u,{method:"POST",body:JSON.stringify({action,p:p||{}})})
      .then(r=>r.text())
      .then(s=>{let o;try{o=JSON.parse(s)}catch(e){throw new Error("ต่อ Apps Script ไม่ได้ เช็กว่าลิงก์ลงท้าย /exec และตั้งผู้มีสิทธิ์เข้าถึงเป็น \"ทุกคน\"")}if(!o.ok)throw new Error(o.err);return o.data})
      .catch(e=>{throw e instanceof Error?e:new Error(String(e))});
  }
  return new Promise((res,rej)=>{
    google.script.run
      .withSuccessHandler(s=>{let o;try{o=JSON.parse(s)}catch(e){return rej(new Error("เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ"))}o.ok?res(o.data):rej(new Error(o.err))})
      .withFailureHandler(e=>rej(new Error((e&&e.message)||String(e))))
      .api(action,p||{});
  });
}
const el=(tag,attrs,...kids)=>{const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;else if(v===true)e.setAttribute(k,"");else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e};
const ROLE={civ:"พลเมือง",spy:"สายลับ",white:"Mr. White"};

/* ---------- state ---------- */
const S={
  sess:LS.get("sess",null),            // {code,token,hostToken}
  room:null, cfg:null, online:true, busy:false, toast:null,
  joinCode:"", joinName:LS.get("name",""), hostPlays:true,
  set:null, shown:false, shownGame:0, hintDraft:"", guessDraft:"", confirmAbort:false, manualPick:null,
  skew:0, popup:null, seenKey:null, opened:{}, autoSent:null
};
function saveSess(){LS.set("sess",S.sess)}
function toast(msg,bad){S.toast={msg,bad};render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;render()},bad?4500:2500)}
function prole(id){const p=S.room&&S.room.players.find(x=>x.id===id);return p&&p.prole}
function pName(id){const p=S.room&&S.room.players.find(x=>x.id===id);return p?p.name:"?"}
/* details ที่จำสถานะเปิด/ปิดไว้ ไม่หุบเองตอนหน้าจออัปเดต */
function shareUrl(){return IN_GAS?(S.cfg&&S.cfg.url)||"":location.origin+location.pathname}
function setupView(){
  return el("div",{class:"panel"},
    el("h2",null,"ตั้งค่าครั้งแรก"),
    el("p",{class:"small"},"วางลิงก์เว็บแอป Apps Script (ลงท้ายด้วย /exec) เพื่อเชื่อมเกมกับ Google Sheet"),
    el("input",{type:"text",id:"apiin",placeholder:"https://script.google.com/macros/s/…/exec",value:S.apiDraft||"",oninput:e=>{S.apiDraft=e.target.value}}),
    el("button",{class:"btn primary",onclick:async()=>{const u=(S.apiDraft||"").trim();if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u))return toast("ลิงก์ต้องขึ้นต้น https://script.google.com/ และลงท้ายด้วย /exec",true);LS.set("api",u);try{S.cfg=await call("config");toast("เชื่อมต่อสำเร็จ")}catch(e){LS.set("api",null);toast(e.message,true)}render()}},"บันทึกและทดสอบ"),
    el("p",{class:"small muted"},"แนะนำให้เจ้าของเว็บใส่ลิงก์นี้ใน API_URL ในไฟล์ index.html แทน เพื่อนจะได้ไม่ต้องกรอกเอง"));
}
function det(key,attrs,summary,...kids){
  return el("details",Object.assign({},attrs,{open:!!S.opened[key],ontoggle:e=>{S.opened[key]=e.target.open}}),summary,...kids);
}
function now(){return Date.now()+S.skew}
function hintLeft(){const g=S.room&&S.room.game;if(!g||!g.hintOpen)return 0;const l=Math.max(0,Math.ceil((g.hintEnds-now())/1000));return g.hintSec?Math.min(g.hintSec,l):l}

/* ---------- ป๊อปอัพผลโหวต ---------- */
function eventKey(v){
  const g=v.game;if(!g) return "none";
  return [g.no,g.last?g.last.round+"-"+(g.last.id||"skip"):"",g.white&&g.white.ok!=null?"w"+g.white.ok:"",v.phase==="over"?"over":""].join(":");
}
function buildPopup(v,prevKey){
  const g=v.game,me=v.me,L=g.last;if(!g) return null;
  const pk=(prevKey||"").split(":"),nk=eventKey(v).split(":");
  const sameGame=pk[0]===nk[0];
  const items=[];let cls="";
  const newLast=L&&(!sameGame||pk[1]!==nk[1]);
  if(newLast){
    if(L.skipped){cls="";items.push(el("div",{class:"big"},"ไม่มีใครถูกโหวตออก"),el("p",{class:"small muted"},"คนกดข้ามเยอะกว่าคะแนนโหวต ไปรอบต่อไป"))}
    else{
      const voted=me&&(L.voters||[]).includes(me.name);
      const isMe=me&&me.id===L.id;
      if(L.role==="civ"){cls="bad";items.push(el("div",{class:"big"},"โหวตผิด!"),el("p",null,`${L.name} เป็นพลเมือง`),L.msg?el("p",{class:"drink"},L.msg):null)}
      else if(L.role==="spy"){cls="good";items.push(el("div",{class:"big"},"จับสายลับได้!"),el("p",null,`${L.name} คือสายลับ`),L.msg?el("p",{class:"drink"},L.msg):null)}
      else {cls="white";items.push(el("div",{class:"big"},"เจอ Mr. White!"),el("p",null,`${L.name} คือ Mr. White ให้ทาย${g.mode==="place"?"สถานที่":"คำ"}ของพลเมือง 1 ครั้ง`))}
      if(isMe) items.push(el("span",{class:"me"},"คุณโดนโหวตออก"));
      else if(voted) items.push(el("span",{class:"me",style:L.role==="civ"?"color:var(--red)":"color:var(--green)"},L.role==="civ"?"คุณโหวตผิดคน":"คุณโหวตถูก!"));
    }
  }
  if(g.white&&g.white.ok!=null&&(!sameGame||pk[2]!==nk[2])&&g.white.ok===false){
    cls=cls||"white";items.push(el("div",{class:"big",style:"font-size:20px"},`Mr. White ทายผิด`),el("p",null,`ทายว่า “${g.white.guess}”`),el("p",{class:"drink"},g.white.msg||""));
  }
  if(v.phase==="over"&&(!sameGame||pk[3]!=="over")){
    const w=g.winner,myRole=me&&(v.players.find(p=>p.id===me.id)||{}).role;
    const title=w==="civ"?"พลเมืองชนะ!":w==="spy"?"ฝ่ายสายลับชนะ!":w==="white"?"Mr. White ทายถูก ชนะทันที!":"จบตานี้แล้ว";
    cls="win";
    if(items.length) items.push(el("hr",{style:"border:0;border-top:1px solid var(--line);width:100%"}));
    items.push(el("div",{class:"big"},title));
    if(g.winMsg) items.push(el("p",{class:"drink"},g.winMsg));
    if(g.reveal) items.push(el("p",{class:"small"},`${g.mode==="place"?"สถานที่":"คำ"}พลเมือง: ${g.reveal.civ} · สายลับ: ${g.reveal.spy}`));
    if(myRole&&w&&w!=="none"){const won=myRole==="civ"?w==="civ":(w==="spy"||w==="white");items.push(el("span",{class:"me",style:won?"color:var(--green)":"color:var(--red)"},won?"ฝ่ายคุณชนะ!":"ฝ่ายคุณแพ้"))}
  }
  return items.length?{cls,items}:null;
}

async function act(action,extra,okMsg){
  if(S.busy) return;
  S.busy=true;render();
  try{
    const d=await call(action,Object.assign({code:S.sess&&S.sess.code,token:S.sess&&S.sess.token,hostToken:S.sess&&S.sess.hostToken},extra||{}));
    if(d&&d.token&&S.sess) {S.sess.token=d.token;saveSess()}
    if(d&&d.view) applyView(d.view);
    if(okMsg) toast(okMsg);
    return d;
  }catch(e){toast(e.message,true)}
  finally{S.busy=false;render()}
}
function applyView(v){
  if(v.serverNow) S.skew=v.serverNow-Date.now();
  const k=eventKey(v);
  if(S.seenKey===null) S.seenKey=k;
  else if(k!==S.seenKey){const p=buildPopup(v,S.seenKey);S.seenKey=k;if(p)S.popup=p}
  const rk=v.game?v.gameNo+":"+v.game.round:"";
  if(rk!==S.roundKey){S.roundKey=rk;S.hintDraft="";S.autoSent=null}
  S.room=v;
  if(v.gameNo!==S.shownGame){S.shownGame=v.gameNo;S.hintDraft="";S.guessDraft="";S.manualPick=null;S.confirmAbort=false}
  if(v.isHost&&!S.set) S.set=Object.assign({},v.settings);
}

/* ---------- polling ---------- */
let polling=false;
async function poll(){
  if(polling||!S.sess||!S.sess.code) return;
  polling=true;
  try{
    const d=await call("state",{code:S.sess.code,token:S.sess.token,hostToken:S.sess.hostToken,vkey:S.force?null:S.room&&S.room.vkey});S.force=false;
    S.online=true;
    if(!d.same){applyView(d.view);render()}
    else if(!S.onlineShown){render()}
    S.onlineShown=true;
  }catch(e){
    if(/ไม่พบห้อง/.test(e.message)){S.sess=null;S.room=null;saveSess();toast(e.message,true)}
    else {S.online=false;S.onlineShown=false;render()}
  }finally{polling=false}
}
function loop(){poll();setTimeout(loop,document.hidden?6000:2000)}

/* ---------- render ---------- */
const app=document.getElementById("app");
function render(){
  const a=document.activeElement, id=a&&a.id, caret=id&&a.selectionStart;
  app.replaceChildren(...[
    el("header",null,el("h1",null,"ใครคือ",el("span",null,"สายลับ")),
      el("span",{class:"small muted"},S.sess?[el("span",{class:"live"+(S.online?"":" off")}),S.online?"ออนไลน์":"กำลังเชื่อมต่อใหม่…"]:"เล่นออนไลน์ 3–20 คน")),

    el("p",{class:"muted small"},r.isHost?"บอกรหัสห้องให้เพื่อนกรอกในมือถือตัวเอง ถ้ามีชื่อแปลกหรือคนเดียวเข้าสองชื่อ กด \"เตะ\" ได้":"รอผู้คุมเกมกดเริ่ม…")
  );
}
function twoTap(key,label,sure,fn,style){
  const armed=S.armed===key;
  return el("button",{class:"btn sm"+(armed?" danger":""),style:style||null,onclick:()=>{if(armed){S.armed=null;fn()}else{S.armed=key;render();clearTimeout(twoTap.t);twoTap.t=setTimeout(()=>{if(S.armed===key){S.armed=null;render()}},3000)}}},armed?sure:label);
}
function stepper(val,min,max,on){
  return el("div",{class:"stepper"},
    el("button",{"aria-label":"ลด",disabled:val<=min,onclick:()=>on(val-1)},"−"),el("output",null,val),
    el("button",{"aria-label":"เพิ่ม",disabled:val>=max,onclick:()=>on(val+1)},"+"));
}
function hostView(r,g){
  const s=S.set||(S.set=Object.assign({},r.settings));
  const n=r.players.length, mb=Math.max(1,Math.floor((n-1)/2));
  const parts=[el("h2",null,"แผงผู้คุมเกม")];
  if(r.phase==="lobby"||r.phase==="over"){
    if(s.spies+s.white>mb){s.white=0;s.spies=Math.max(1,Math.min(s.spies,mb))}
    parts.push(
      el("div",{class:"grid2"},
        el("div",{class:"field"},el("label",null,"จำนวนสายลับ"),stepper(s.spies,1,Math.max(1,Math.min(3,mb-s.white)),v=>{s.spies=v;render()})),
        el("div",{class:"field"},el("label",null,"Mr. White"),el("div",{class:"seg"},[[0,"ไม่มี"],[1,"มี"]].map(([v,l])=>el("button",{"aria-pressed":String(s.white===v),disabled:v===1&&s.spies+1>mb,onclick:()=>{s.white=v;render()}},l))))),
      el("div",{class:"field"},el("label",null,"โหมดเกม"),
        el("div",{class:"seg"},[["word","คำศัพท์"],["place","สถานที่ + บทบาท"]].map(([k,l])=>el("button",{"aria-pressed":String((s.mode||"word")===k),onclick:()=>{s.mode=k;render()}},l)))),
      s.mode==="place"?el("p",{class:"small muted"},`ทุกคนได้สถานที่ + บทบาทของตัวเอง เช่น โรงเรียน · ครูพละ ส่วนสายลับได้สถานที่คล้ายๆ พร้อมบทบาทของที่นั่น${S.cfg&&S.cfg.placeCount?` · มี ${S.cfg.placeCount} สถานที่`:""}`):
      el("div",{class:"field"},el("label",{for:"cat"},"หมวดคำ"),
        el("select",{id:"cat",onchange:e=>{s.cat=e.target.value}},
          [el("option",{value:""},"ทุกหมวด")].concat((S.cfg?S.cfg.cats:[]).map(c=>{const o=el("option",{value:c.name},`${c.name} (${c.count} คู่)`);if(c.name===s.cat)o.selected=true;return o})))),
      el("div",{class:"field"},el("label",null,"เวลาพิมพ์คำใบ้ต่อรอบ"),
        el("div",{class:"seg"},[[15,"15 วิ"],[30,"30 วิ"],[60,"60 วิ"],[0,"ไม่จับเวลา"]].map(([k,l])=>el("button",{"aria-pressed":String((s.hintSec==null?15:s.hintSec)===k),onclick:()=>{s.hintSec=k;render()}},l)))),
      el("div",{class:"field"},el("label",null,"ระดับบทลงโทษ"),
        el("div",{class:"seg"},[["sip","จิบ"],["gulp","อึก"],["shot","ช็อต"]].map(([k,l])=>el("button",{"aria-pressed":String(s.unit===k),onclick:()=>{s.unit=k;render()}},l)))),
      el("p",{class:"small muted"},n<3?`ต้องมีผู้เล่นอย่างน้อย 3 คน (ตอนนี้ ${n})`:`${n} คน · สายลับ ${s.spies}${s.white?" · Mr. White 1":""} · เซิร์ฟเวอร์จะสุ่มที่นั่งและแจกคำให้แต่ละเครื่อง`),
      el("button",{class:"btn primary",disabled:S.busy||n<3,onclick:()=>act("start",{settings:s})},r.phase==="over"?"เริ่มตาใหม่":"เริ่มเกม"),
      el("div",{class:"row"},
        el("button",{class:"btn sm",disabled:S.busy,onclick:async()=>{S.busy=true;render();try{S.cfg=await call("reloadWords");toast("โหลดชุดคำจากชีทใหม่แล้ว")}catch(e){toast(e.message,true)}finally{S.busy=false;render()}}},"โหลดชุดคำจากชีทใหม่")),
      S.cfg?el("p",{class:"small muted"},S.cfg.src==="sheet"?`ชุดคำจาก Google Sheet · ${S.cfg.cats.length} หมวด`:`ใช้ชุดคำสำรอง${S.cfg.err?` (${S.cfg.err})`:""}`):null
    );
  }
  if(r.phase==="play"){
    const alive=r.players.filter(p=>p.inGame&&p.alive);
    if(g.hintOpen) parts.push(el("button",{class:"btn",disabled:S.busy,onclick:()=>act("endHint")},"หยุดเวลา เปิดคำใบ้เลย"));
    parts.push(
      el("button",{class:"btn primary",disabled:S.busy||!g.voted.length,onclick:()=>act("close")},`นับคะแนนเลย ไม่รอครบ (${g.voted.length}/${alive.length})`),
      el("p",{class:"small muted"},"ปกติระบบนับเองเมื่อทุกคนโหวตหรือกดข้ามครบ ใช้ปุ่มนี้เมื่อมีคนไม่ยอมโหวต · คะแนนเท่ากันจะให้โหวตใหม่เฉพาะคนที่เท่ากัน ถ้าเล่นแบบชี้นิ้วในวง ใช้ \"เลือกคนออกเอง\" ด้านล่างแทนได้"),
      det("manual",null,el("summary",{class:"small"},"เลือกคนออกเอง"),
        el("div",{class:"votes",style:"margin-top:10px"},alive.map(p=>el("button",{class:"vbtn","aria-pressed":String(S.manualPick===p.id),onclick:()=>{S.manualPick=S.manualPick===p.id?null:p.id;render()}},p.name,el("small",null,`ที่นั่ง ${p.seat}`)))),
        el("button",{class:"btn danger",style:"margin-top:10px;width:100%",disabled:!S.manualPick||S.busy,onclick:()=>{act("eliminate",{target:S.manualPick});S.manualPick=null}},S.manualPick?`ให้ ${pName(S.manualPick)} ออก`:"เลือกคนก่อน"))
    );
  }
  if(r.phase==="play"||r.phase==="white"){
    parts.push(
      el("button",{class:"btn",disabled:S.busy,onclick:()=>act("bonus")},"สุ่มการ์ดลงโทษพิเศษ (ทุกคนเห็น)"),
      !S.confirmAbort?el("button",{class:"btn sm",onclick:()=>{S.confirmAbort=true;render()}},"จบตานี้และเฉลย")
        :el("div",{class:"row"},el("button",{class:"btn sm",onclick:()=>{S.confirmAbort=false;render()}},"ยกเลิก"),el("button",{class:"btn sm danger",onclick:()=>{S.confirmAbort=false;act("abort")}},"ยืนยันจบตา"))
    );
  }
  return el("div",{class:"panel",style:"border-color:var(--amber)"},parts);
}
function rulesPanel(){
  const pen=S.room&&S.room.game?S.room.game.pen:null;
  return det("rules",{class:"panel"},
    el("summary",null,"กติกา"),
    el("ol",{class:"small"},
      el("li",null,"ผู้คุมเกมสร้างห้อง บอกรหัสให้เพื่อน ทุกคนเข้าห้องจากมือถือตัวเองด้วยชื่อตัวเอง"),
      el("li",null,"กดเริ่มเกม เซิร์ฟเวอร์สุ่มที่นั่งและแจกคำ แต่ละเครื่องเห็นเฉพาะคำของตัวเอง (สลับดูของคนอื่นไม่ได้)"),
      el("li",null,"พลเมืองได้คำเดียวกัน สายลับได้คำคล้ายๆ และไม่รู้ตัว Mr. White ไม่ได้คำ"),
      el("li",null,"ใบ้ตามลำดับคนละ 1 ประโยค ห้ามพูดคำตรงๆ แล้วทุกคนโหวตหรือกดข้ามในมือถือ ครบทุกคนระบบนับคะแนนเอง ถ้าคนข้ามเยอะกว่าคะแนนสูงสุดจะไม่มีใครออก"),
      el("li",null,"โหมดสถานที่ + บทบาท: ได้ชื่อสถานที่และบทบาท (เช่น โรงเรียน · ภารโรง) ใบ้แบบสวมบทบาท สายลับได้สถานที่คล้ายๆ"),
      el("li",null,"Mr. White ที่โดนโหวตออกได้ทายคำพลเมือง 1 ครั้ง ทายถูกชนะทันที"),
      el("li",null,"พลเมืองชนะเมื่อจับสายลับและ Mr. White ได้หมด สายลับชนะเมื่อฝ่ายตัวเองเหลือเท่ากับพลเมือง")),
    pen?el("ul",{class:"small"},Object.keys(pen).map(k=>el("li",null,(S.cfg&&S.cfg.pen[k]?S.cfg.pen[k].label+": ":"")+pen[k].replace(/\{S\}/g,"ที่โดนโหวต")))):null
  );
}

/* ---------- boot ---------- */
call("config").then(c=>{S.cfg=c;render()}).catch(()=>{});
function setRoomParam(c){if(c&&!S.sess){S.joinCode=String(c).toUpperCase().slice(0,5);render()}}
if(IN_GAS){try{google.script.url.getLocation(loc=>setRoomParam(loc&&loc.parameter&&loc.parameter.room))}catch(e){}}
else setRoomParam(new URLSearchParams(location.search).get("room"));
render();
loop();
setInterval(()=>{
  const g=S.room&&S.room.game;
  if(!g||S.room.phase!=="play"||!g.hintOpen) return;
  const left=hintLeft(), cd=document.getElementById("cd"), box=document.getElementById("timerbox");
  if(cd&&cd.textContent!==String(left)){cd.textContent=left;if(box)box.classList.toggle("low",left<=5)}
  const me=S.room.me, ms=g.hintEnds-now();
  if(me&&me.alive&&me.inGame&&ms<1500&&ms>0&&S.hintDraft.trim()&&S.hintDraft.trim()!==(g.hints[me.id]||"")&&S.autoSent!==S.hintDraft&&!S.busy) sendHint();
  if(ms<=0&&!S.force){S.force=true;poll()}
},250);
})();
</script>
